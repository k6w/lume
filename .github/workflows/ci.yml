name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate -s Lume/project.yml

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project Lume/Lume.xcodeproj \
            -scheme Lume \
            -resolvePackageDependencies

      - name: Build (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project Lume/Lume.xcodeproj \
            -scheme Lume \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- \
            build

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Lume/Lume.xcodeproj \
            -scheme Lume \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- \
            test

  lint-svg:
    name: Asset sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SVG well-formedness
        run: |
          for f in assets/*.svg \
                   Lume/Lume/Resources/Assets.xcassets/**/*.svg; do
            [[ -f "$f" ]] || continue
            xmllint --noout "$f" || { echo "Bad SVG: $f"; exit 1; }
          done
