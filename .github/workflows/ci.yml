name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-sanity:
    name: Project sanity (XcodeGen)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate -s Lume/project.yml
      - name: Verify project files
        run: |
          test -d Lume/Lume.xcodeproj
          test -f Lume/Lume.xcodeproj/project.pbxproj

  asset-sanity:
    name: Asset sanity (SVG well-formedness)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y libxml2-utils
      - name: Validate SVGs
        run: |
          set -e
          find assets Lume/Lume/Resources/Assets.xcassets \
            -type f -name '*.svg' -print0 \
            | xargs -0 -I{} xmllint --noout '{}'

  # Real macOS 26 build/test runs on a self-hosted runner once
  # GitHub-hosted runners ship with the macOS 26 SDK. Until then,
  # `./scripts/run.sh` and `./scripts/run.sh test` are the local
  # source of truth (29 tests at last run).
  build-test:
    name: Build & Test (macOS 26 only)
    runs-on: macos-latest
    if: ${{ vars.ENABLE_MACOS26_BUILD == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate -s Lume/project.yml
      - run: xcodebuild -project Lume/Lume.xcodeproj -scheme Lume -resolvePackageDependencies
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Lume/Lume.xcodeproj \
            -scheme Lume \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- \
            build
      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project Lume/Lume.xcodeproj \
            -scheme Lume \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- \
            test
