name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0). Without leading v.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF##*/}"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build release artifact
        run: ./scripts/release.sh "${{ steps.ver.outputs.version }}"

      - name: Verify artifacts exist
        run: |
          set -e
          ls -la dist/
          test -f "dist/Lume-${{ steps.ver.outputs.version }}.zip"
          test -f "dist/Lume-${{ steps.ver.outputs.version }}.dmg"
          test -f "dist/SHA256SUMS"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Lume ${{ steps.ver.outputs.tag }} — unsigned macOS 26 build.

            **First-launch Gatekeeper bypass:**
            ```sh
            xattr -dr com.apple.quarantine /Applications/Lume.app
            ```
            Or right-click the app, choose **Open**, then click **Open** in the warning dialog.

            See `CHANGELOG.md` for full release notes.
          files: |
            dist/Lume-${{ steps.ver.outputs.version }}.zip
            dist/Lume-${{ steps.ver.outputs.version }}.dmg
            dist/SHA256SUMS
