name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0). Without leading v.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF##*/}"
            v="${v#v}"
          fi
          echo "version=$v"   >> "$GITHUB_OUTPUT"
          echo "tag=v$v"      >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Lume ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Lume ${{ steps.ver.outputs.tag }}.

            **Pre-built binaries are uploaded out-of-band** because GitHub
            Actions hosted macOS runners don't yet ship the macOS 26 SDK.
            The .app bundle in the assets below (when present) was built
            from this exact commit on a macOS 26 box via
            `./scripts/release.sh`.

            **First-launch Gatekeeper bypass:**
            ```sh
            xattr -dr com.apple.quarantine /Applications/Lume.app
            ```
            Or right-click the app, choose **Open**, then click **Open** in the warning dialog.

            See `CHANGELOG.md` for the full release notes.
