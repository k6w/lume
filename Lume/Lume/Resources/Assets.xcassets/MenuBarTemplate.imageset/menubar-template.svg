<!--
  Menu-bar template glyph. Single-color black; macOS auto-tints (Template image).
  Designed at 22×22 (the macOS menu-bar icon point size).
  Same L-in-tile silhouette as the full mark, with the spark dot intact.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22" role="img" aria-label="Lume">
  <title>Lume</title>
  <!-- Outer rounded square (the tile) -->
  <path fill-rule="evenodd" clip-rule="evenodd"
        d="M5.5 2.25h11A3.25 3.25 0 0 1 19.75 5.5v11a3.25 3.25 0 0 1-3.25 3.25h-11A3.25 3.25 0 0 1 2.25 16.5v-11A3.25 3.25 0 0 1 5.5 2.25Zm0 1.5A1.75 1.75 0 0 0 3.75 5.5v11c0 .967.783 1.75 1.75 1.75h11a1.75 1.75 0 0 0 1.75-1.75v-11a1.75 1.75 0 0 0-1.75-1.75h-11Z"/>
  <!-- L (vertical + horizontal bars), optically centered -->
  <rect x="7"    y="6.25" width="2"   height="9.5" rx="1"/>
  <rect x="7"    y="13.75" width="7.5" height="2"  rx="1"/>
